name: Complete product checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check:release
  application:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: red-koala
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: red-koala/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run demo:generate && npm run typecheck
      - run: npm run build
  sample-provider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sample-provider/package-lock.json
      - run: npm ci
      - run: npm test
