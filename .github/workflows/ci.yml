name: Complete product checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check:release
      - run: npm run data:verify
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run simulate:profile
      - name: Verify isolated complete demo
        shell: bash
        run: |
          npm run demo -- --no-open > /tmp/zhishan-demo.log 2>&1 &
          launcher=$!
          trap 'kill "$launcher" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 900); do
            if curl --fail --silent http://127.0.0.1:4273/api/demo/v1/state > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$launcher" 2>/dev/null; then
              tail -100 /tmp/zhishan-demo.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then tail -100 /tmp/zhishan-demo.log; exit 1; fi
          npm run demo:smoke
